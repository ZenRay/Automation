name: Deploy - Build, Scan & Push

on:
  workflow_run:
    workflows: ["CI - Lint & Test"]
    types: [completed]
    branches: [staging, production]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: zenray/automation

permissions:
  packages: write
  contents: read

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  guard:
    # 仅在 CI 成功且目标分支为 staging/production 时继续
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'staging' ||
       github.event.workflow_run.head_branch == 'production')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ github.event.workflow_run.head_sha }}
      branch: ${{ github.event.workflow_run.head_branch }}
    steps:
      - run: |
          echo "CI passed on ${{ github.event.workflow_run.head_branch }} at ${{ github.event.workflow_run.head_sha }}"

  build-scan-push:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=${{ needs.guard.outputs.branch }}

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: automation:${{ github.event.workflow_run.head_sha }}

      - name: Trivy secret scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: automation:${{ github.event.workflow_run.head_sha }}
          scanners: secret
          exit-code: "1"

      - name: Verify no credential files in image
        run: |
          RESULT=$(docker run --rm automation:${{ github.event.workflow_run.head_sha }} find /app -name "*.ini" -o -name ".env")
          if [ -n "$RESULT" ]; then
            echo "FAIL: Credential files found in image:"
            echo "$RESULT"
            exit 1
          fi
          echo "PASS: No credential files found"

      - name: Push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: [guard, build-scan-push]
    if: needs.guard.outputs.branch == 'production'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || '22' }}
          command_timeout: 30m
          script: |
            set -euo pipefail

            CONFIG_DIR="${CONFIG_DIR:-/opt/automation/config}"
            LOG_DIR="/opt/automation/logs"
            IMAGE="ghcr.io/${{ env.IMAGE_NAME }}:sha-${{ needs.guard.outputs.sha }}"

            # 登录 GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

            # 拉取新镜像（重试 3 次）
            for i in 1 2 3; do
              if podman pull "$IMAGE"; then
                break
              fi
              echo "[deploy] Pull attempt $i failed, retrying in 10s..."
              sleep 10
            done

            # 停止并移除旧容器
            podman rm -f automation-worker 2>/dev/null || true
            podman rm -f automation-scheduler 2>/dev/null || true

            # 确保日志目录存在
            mkdir -p "$LOG_DIR"

            # 启动 scheduler 容器（定时执行 cron_task.sh）
            podman run -d \
              --name automation-scheduler \
              --restart always \
              --cpus 4.0 --memory 8g \
              -e TZ=Asia/Shanghai \
              -e PYTHONLOGFORMAT=text \
              -e LOG_LEVEL=INFO \
              -e SCHEDULE_HOUR=8 \
              -e SCHEDULE_MIN=20 \
              -v "${CONFIG_DIR}/_lark.ini:/app/automation/conf/_lark.ini:ro" \
              -v "${CONFIG_DIR}/_maxcomputer.ini:/app/automation/conf/_maxcomputer.ini:ro" \
              -v "${LOG_DIR}:/app/logs" \
              "$IMAGE" \
              bash /app/deploy/scripts/scheduler.sh

            # 健康检查：等待容器启动并验证状态
            sleep 5
            STATUS=$(podman inspect automation-scheduler --format '{{.State.Status}}' 2>/dev/null || echo "not_found")
            if [ "$STATUS" != "running" ]; then
              echo "[deploy] FAIL: Container status is '$STATUS', expected 'running'"
              podman logs --tail 20 automation-scheduler 2>&1 || true
              exit 1
            fi
            echo "[deploy] Container health check passed: status=$STATUS"

            # 清理旧镜像
            podman image prune -f || true

            echo "[deploy] Deployment complete: $IMAGE"
